<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pemilihan HIMASI 2026</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f3f7fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 440px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            border: 2px solid #e1ecf8;
            box-shadow: 0 8px 25px rgba(21, 101, 192, 0.10);
            text-align: center;
        }

        h1 { color: #1565c0; font-size: 26px; letter-spacing: 1px; }
        .sub { color: #666; margin: 8px 0 28px; }

        .role-pilihan { display: flex; gap: 10px; }

        .btn-role {
            flex: 1;
            height: 52px;
            border: 2px solid #1565c0;
            border-radius: 10px;
            background: white;
            color: #1565c0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-role:hover { background: #e8f1fb; }
        .btn-role.aktif { background: #1565c0; color: white; }

        #formAdmin { display: none; margin-top: 25px; text-align: left; }

        label { display: block; color: #555; font-size: 14px; font-weight: bold; margin-bottom: 6px; }

        input {
            width: 100%;
            height: 46px;
            border: 2px solid #e1ecf8;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }

        input:focus { border-color: #1565c0; }

        .btn-masuk {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #1565c0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-masuk:hover { background: #0d47a1; }
        .btn-masuk:disabled { background: #90a4c0; cursor: wait; }

        #pesanError { color: #c62828; font-size: 14px; margin-bottom: 12px; min-height: 18px; 
            @media (max-width: 480px) {
    .login-box {
        padding: 25px 20px;
    }

    h1 {
        font-size: 21px;
    }

    .role-pilihan {
        flex-direction: column;
    }

    /* 16px mencegah iPhone otomatis zoom saat input diketuk */
    input {
        font-size: 16px;
    }
}

        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>PEMILIHAN HIMASI 2026</h1>
        <p class="sub">Pilih peran untuk masuk</p>

        <div class="role-pilihan">
            <button class="btn-role" id="btnAdmin" onclick="pilihRole('admin')">Admin</button>
            <button class="btn-role" id="btnGuest" onclick="pilihRole('guest')">Mahasiswa</button>
        </div>

        <form id="formAdmin" onsubmit="loginAdmin(event)">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>

            <div id="pesanError"></div>

            <button type="submit" class="btn-masuk" id="btnMasuk">MASUK</button>
        </form>

    </div>

    <script>
        // Samakan dengan API_URL di script.js
        const API_URL = "https://kpu-himasi-2026-production.up.railway.app";

        // Kalau sudah login sebelumnya, langsung ke halaman utama
        if (sessionStorage.getItem("role")) {
            location.href = "index.html";
        }

        function pilihRole(role) {
            if (role === "guest") {
                sessionStorage.setItem("role", "guest");
                sessionStorage.removeItem("token");
                location.href = "index.html";
                return;
            }

            document.getElementById("btnAdmin").classList.add("aktif");
            document.getElementById("btnGuest").classList.remove("aktif");
            document.getElementById("formAdmin").style.display = "block";
            document.getElementById("username").focus();
        }

        async function loginAdmin(e) {
            e.preventDefault();

            const pesan = document.getElementById("pesanError");
            const tombol = document.getElementById("btnMasuk");

            pesan.textContent = "";
            tombol.disabled = true;
            tombol.textContent = "MEMPROSES...";

            try {
                const res = await fetch(API_URL + "/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        username: document.getElementById("username").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    pesan.textContent = data.error || "Login gagal";
                } else {
                    sessionStorage.setItem("role", "admin");
                    sessionStorage.setItem("token", data.token);
                    location.href = "index.html";
                    return;
                }

            } catch (err) {
                pesan.textContent = "Tidak bisa terhubung ke server";
            }

            tombol.disabled = false;
            tombol.textContent = "MASUK";
        }
    </script>

</body>
</html>
